<style id="css">
:root{--bg:#fff;--ink:#1d2330;--muted:#5f6878;--line:#e3e6ec;--yellow:#ffd21f;--chip:#f4f6f9;--field:#fff;--err:#c62828;--warn:#a15c00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a21;--ink:#eef0f4;--muted:#9aa3b2;--line:#2b303b;--chip:#222732;--field:#1d212a;--err:#ff6b6b;--warn:#f0b35a}}
:root[data-theme="dark"]{--bg:#171a21;--ink:#eef0f4;--muted:#9aa3b2;--line:#2b303b;--chip:#222732;--field:#1d212a;--err:#ff6b6b;--warn:#f0b35a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
.wrap{max-width:1280px;margin:0 auto;padding:28px 20px 48px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px;margin-bottom:24px}
h1{font-family:"Barlow Semi Condensed",Barlow,sans-serif;font-weight:700;font-size:clamp(1.6rem,3vw,2.2rem);margin:0 0 4px}
.lead{color:var(--muted);margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.colhead{border-bottom:4px solid var(--yellow);padding-bottom:8px;margin-bottom:12px}
.colhead h2{font-family:"Barlow Semi Condensed",Barlow,sans-serif;font-size:1.6rem;margin:0}
.colhead p{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.step h3{font-family:"Barlow Semi Condensed",Barlow,sans-serif;font-weight:600;font-size:1.1rem;margin:12px 0 4px;display:flex;align-items:center;gap:8px}
.stepn{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:4px;background:var(--yellow);color:#1d2330;font-size:.9rem}
.cases{list-style:none;margin:0;padding:0}
.case{display:flex;gap:8px;align-items:stretch;padding:5px 0;border-top:1px solid var(--line)}
.prob{font-size:.65rem;color:var(--muted);line-height:1;width:100%;text-align:center}
.case.shut .prob{display:none}
.strip{flex:0 0 26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.strip button{width:20px;height:20px;padding:0;display:grid;place-items:center;border:none;background:none;color:var(--muted);cursor:pointer;font-size:.85rem;line-height:1;border-radius:4px}
.strip button:hover{background:var(--chip);color:var(--ink)}
.st[data-s="learning"]{color:#b8860b}
.st[data-s="learned"]{color:#1a8547}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .st[data-s="learning"]{color:#f0c040}:root:not([data-theme="light"]) .st[data-s="learned"]{color:#4ccf87}}
:root[data-theme="dark"] .st[data-s="learning"]{color:#f0c040}:root[data-theme="dark"] .st[data-s="learned"]{color:#4ccf87}
.case.learning{background:rgba(240,205,42,.16)}
.case.learned{background:rgba(34,165,89,.14)}
.case.learning,.case.learned{border-radius:6px}
.case{padding-left:4px;padding-right:6px}
.case.shut .pic,.case.shut .alg,.case.shut .msg,.case.shut .mir,.case.shut .rst{display:none}
.case.shut{align-items:center;padding:3px 0;min-height:0}
.case.shut .strip{flex-direction:row;align-items:center;justify-content:flex-start;gap:4px}
.case.shut .name{font-size:.95rem}
.case.shut .txt{gap:0}
.case.shut .name{font-size:1.05rem;color:var(--ink)}
.altrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:1px}.altrow .alg{flex:1;min-width:0;width:auto}.altrow .amsg{flex-basis:100%}
.altlbl{font-size:.75rem;color:var(--muted);white-space:nowrap}
.alg.alt{font-size:1rem}
.case.shut .altrow{display:none}
.step h3{cursor:pointer;user-select:none}
.step h3 .chev{color:var(--muted);font-size:.8rem;margin-left:auto}
.step.shut .cases{display:none}
.pic{flex:0 0 74px;align-self:center;width:74px;height:74px;background:var(--chip);border-radius:5px;padding:3px}
.pic svg{width:100%;height:100%;display:block}
.txt{display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0;flex:1}
.row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.name{font-family:"Barlow Semi Condensed",Barlow,sans-serif;font-weight:600;color:var(--muted);font-size:.95rem;margin-right:auto}
.alg{width:100%;font-family:"Barlow Semi Condensed",Barlow,sans-serif;font-weight:600;font-size:1.1rem;letter-spacing:.02em;word-spacing:.2em;
color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:5px;padding:2px 7px;resize:none;overflow:hidden;line-height:1.3}
.alg:focus{outline:2px solid var(--yellow);outline-offset:1px;border-color:transparent}
.alg.changed{border-color:var(--yellow)}
button{font:inherit;font-size:.8rem;font-weight:500;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:0 8px;cursor:pointer}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.sync{font-size:.85rem;color:var(--muted);flex-basis:100%}
.btnlike{font-size:.8rem;font-weight:500;background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:0 8px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--yellow)}
.msg{font-size:.8rem;line-height:1.2}.msg:empty{display:none}
.msg.err{color:var(--err)}.msg.warn{color:var(--warn)}.msg.ok{color:var(--muted)}

.layout{display:flex;align-items:flex-start;gap:20px}
.grid{flex:1;min-width:0}
.side{flex:0 0 250px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--chip)}
.side.shut{flex-basis:250px;padding:4px 8px;display:flex;align-items:center;gap:6px}
.side.shut .tbody{flex:1;min-width:0}
.side.shut .tfold{order:2;flex:0 0 auto;width:auto;text-align:center}
.side.shut .tbody{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"clock scr";gap:0 8px;align-items:center}
.side.shut .thead,.side.shut .stats,.side.shut .times,.side.shut .tbot,.side.shut .histbtn,.side.shut .hint,.side.shut #tNew{display:none}
.side.shut .clock{grid-area:clock;font-size:1.4rem;padding:2px 8px;min-width:3.6em;text-align:center}
.side.shut .scramble{grid-area:scr;font-size:.75rem;line-height:1.2;margin:0;min-height:0;max-height:2.4em;overflow:hidden}
.side.shut .srow{display:inline}.side.shut .srow::after{content:" "}

.tfold{width:100%;background:none;border:none;color:var(--muted);text-align:right;padding:0;cursor:pointer;font-size:.8rem}
.thead{display:flex;align-items:baseline;justify-content:space-between;gap:6px;flex-wrap:wrap}
.thead h2{font-family:"Barlow Semi Condensed",Barlow,sans-serif;font-size:1.3rem;margin:0}
.insp{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:4px;cursor:pointer}
.scramble{font-family:"Barlow Semi Condensed",Barlow,sans-serif;font-size:1rem;line-height:1.35;word-spacing:.25em;margin:6px 0;min-height:5.4em}
.srow{display:block;font-variant-numeric:tabular-nums}
.clock{font-family:"Barlow Semi Condensed",Barlow,sans-serif;font-size:2.6rem;font-weight:700;text-align:center;padding:10px 0;border-radius:8px;background:var(--bg);border:1px solid var(--line);cursor:pointer;user-select:none;touch-action:none;font-variant-numeric:tabular-nums}
.clock:focus-visible{outline:2px solid var(--yellow)}
.clock.hold{color:#c0362c}.clock.ready{color:#1a8547}.clock.run{color:var(--ink)}
.hint{font-size:.7rem;color:var(--muted);text-align:center;margin:4px 0 8px}
.stats{display:grid;grid-template-columns:auto auto;gap:1px 10px;font-size:.8rem;color:var(--muted);margin-bottom:8px}
.stats b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.times{list-style:none;margin:0;padding:0;max-height:210px;overflow:auto;font-size:.85rem}
.times li{display:flex;align-items:center;gap:6px;padding:1px 0;border-top:1px solid var(--line)}
.times .n{color:var(--muted);width:2em;text-align:right;font-size:.75rem}
.times .v{font-variant-numeric:tabular-nums;flex:1}
.times .v.dnf{text-decoration:line-through;color:var(--muted)}
.times button{font-size:.7rem;padding:0 4px;background:none;border:none;color:var(--muted)}
.times button:hover{color:var(--ink);background:var(--chip)}
.small{font-size:.75rem}
.tbot{margin-top:6px}
@media (max-width:860px){.layout{flex-direction:column}.side{position:static;width:100%;flex-basis:auto}.side.shut{width:100%;flex-basis:auto;align-self:stretch}}
@media print{.side{display:none}}

}

const SKELETON="<div class=\"wrap\">\n<div class=\"top\"><div><h1>Speedcubing Assistant</h1>\n<p class=\"lead\">Left-hand algorithms. Edit any formula and the diagram updates.</p></div>\n<div class=\"menuwrap\"><button id=\"menuBtn\" type=\"button\" class=\"menubtn\" aria-expanded=\"false\">Menu \u25be</button>\n<div class=\"tools\" id=\"tools\"><button id=\"dlHtml\" type=\"button\">Download offline copy</button><button id=\"exJson\" type=\"button\">Export .json</button><label class=\"btnlike\" for=\"imJson\">Import .json</label><input id=\"imJson\" type=\"file\" accept=\".json,application/json\" hidden><button id=\"bake\" type=\"button\" hidden>Save edits into the page</button><button id=\"print\" type=\"button\">Print sheet</button><button id=\"theme\" type=\"button\">Theme: auto</button><button id=\"resetAll\" type=\"button\">Reset all</button><span id=\"sync\" class=\"sync\"></span></div></div></div>\n<div class=\"layout\">\n<aside id=\"timer\" class=\"side\">\n<button id=\"tFold\" class=\"tfold\" type=\"button\" title=\"Hide timer\">&#9666;</button>\n<div class=\"tbody\">\n<div class=\"thead\"><h2>Timer</h2><label class=\"insp\"><input type=\"checkbox\" id=\"tInsp\"> 15s inspection</label></div>\n<div id=\"tScr\" class=\"scramble\"></div>\n<button id=\"tNew\" type=\"button\" class=\"small\">New scramble</button>\n<div id=\"tClock\" class=\"clock\" tabindex=\"0\" role=\"button\" aria-label=\"Hold space or tap and hold, then release to start\">0.00</div>\n<p class=\"hint\" id=\"tHint\">Hold space (or touch) &mdash; release to start</p>\n<div id=\"tStats\" class=\"stats\"></div>\n<button id=\"tHist\" type=\"button\" class=\"small histbtn\">Times \u25be</button>\n<ul id=\"tList\" class=\"times\"></ul>\n<div class=\"tools tbot\"><button id=\"tClear\" type=\"button\" class=\"small\">Clear session</button></div>\n</div></aside>\n<div class=\"grid\"><section class=\"col\" id=\"oll\"></section><section class=\"col\" id=\"pll\"></section></div>\n</div>\n</div>\n";
const HEADBITS="<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Speedcubing Assistant</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"><link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap\" rel=\"stylesheet\">\n";

const DATA={
 oll:{title:"2-Look OLL",sub:"Orientation: make the top face one colour.",steps:[

/* ---- cube model: stickers with position + normal ---- */
const COL={U:"#f0cd2a",D:"#f6f4ef",F:"#1f9e5a",B:"#1a55b3",R:"#e8701f",L:"#c0362c"};
const GRAY="#98a0ab";
const NORM={U:[0,1,0],D:[0,-1,0],R:[1,0,0],L:[-1,0,0],F:[0,0,1],B:[0,0,-1]};
function solved(){const s=[];for(const f in NORM){const n=NORM[f];
 for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){let p;
  if(n[0])p=[n[0],a,b];else if(n[1])p=[a,n[1],b];else p=[a,b,n[2]];
  s.push({p,n:[...n],f,h:[...p]});}}return s}
// rotate vector 90° steps about axis (0=x,1=y,2=z), q quarter-turns (+ = CCW by right-hand rule)
function rot(v,ax,q){q=((q%4)+4)%4;let [x,y,z]=v;
 for(let i=0;i<q;i++){ if(ax===0)[y,z]=[-z,y]; else if(ax===1)[z,x]=[-x,z]; else [x,y]=[-y,x]; }
 return [x,y,z]}
// move table: axis, layer test, base quarter-turns (+1 = CCW about +axis)
const MV={
 R:[0,c=>c===1,-1], L:[0,c=>c===-1,1], M:[0,c=>c===0,1],
 r:[0,c=>c>=0,-1], l:[0,c=>c<=0,1], x:[0,()=>true,-1],
 U:[1,c=>c===1,-1], D:[1,c=>c===-1,1], E:[1,c=>c===0,1],
 u:[1,c=>c>=0,-1], d:[1,c=>c<=0,1], y:[1,()=>true,-1],
 F:[2,c=>c===1,-1], B:[2,c=>c===-1,1], S:[2,c=>c===0,-1],
 f:[2,c=>c>=0,-1], b:[2,c=>c<=0,1], z:[2,()=>true,-1]};
function parse(str){
 const toks=str.replace(/[()\[\]]/g," ").trim().split(/\s+/).filter(Boolean);const out=[];
 for(const t of toks){const m=t.match(/^([RLUDFBMESxyzrludfb])(w?)(2|3)?('?)(2?)$/);
  if(!m)throw new Error("Unknown move: "+t);
  let face=m[1];if(m[2]){if(!"RLUDFB".includes(face))throw new Error("Unknown move: "+t);face=face.toLowerCase();}
  let n=parseInt(m[3]||m[5]||"1");if(m[4])n=-n;out.push([face,n]);}
 return out}
function apply(st,moves){for(const [f,n] of moves){const [ax,test,q]=MV[f];
 for(const s of st)if(test(s.p[ax])){s.p=rot(s.p,ax,q*n);s.n=rot(s.n,ax,q*n);}}}
function orientFix(moves){
 const st=solved();apply(st,moves);
 const A=[[],[[0,1]],[[0,2]],[[0,3]],[[2,1]],[[2,3]]];
 for(const a of A)for(let q=0;q<4;q++){const seq=a.concat(q?[[1,q]]:[]);
  const c=f=>{let p=st.find(s=>s.f===f&&Math.abs(s.p[0])+Math.abs(s.p[1])+Math.abs(s.p[2])===1).p;for(const [ax,k] of seq)p=rot(p,ax,k);return p};
  if(eq(c("U"),[0,1,0])&&eq(c("F"),[0,0,1]))return seq.map(([ax,k])=>["xyz"[ax],-k])}
 return []}
function invert(moves){return moves.slice().reverse().map(([f,n])=>[f,-n])}
function fmt(moves){return moves.map(([f,n])=>{const a=Math.abs(n)%4;
 return f+(a===2?"2":"")+((n<0&&a!==2)?"'":"")}).join(" ")}
function mirror(str){const sw={R:"L",L:"R",r:"l",l:"r"};
 return fmt(parse(str).map(([f,n])=>{if("RLrl".includes(f))return[sw[f],-n];if("Mx".includes(f))return[f,n];return[f,-n]}))}
const eq=(a,b)=>a[0]===b[0]&&a[1]===b[1]&&a[2]===b[2];

/* ---- diagram ---- */
function isCorner(p){return Math.abs(p[0])+Math.abs(p[2])===2}
function isEdge(p){return Math.abs(p[0])+Math.abs(p[2])===1}
const inPair=s=>(s.h[0]===1&&s.h[2]===1&&(s.h[1]===-1||s.h[1]===0));
function colour(s,mask){
 const c=COL[s.f];
 if(mask==="f2l")return inPair(s)?c:GRAY;
 if(mask==="oll"||mask==="edges"){ if(mask==="edges"&&isCorner(s.p))return GRAY; return s.f==="U"?c:GRAY; }

function draw(st,mask){
 const T=12,C=25,O=0.5;let out=`<svg viewBox="0 0 100 100" role="img" aria-label="Last layer diagram">`;
 const r=(x,y,w,h,f)=>`<rect x="${x+O}" y="${y+O}" width="${w-1}" height="${h-1}" rx="2" fill="${f}" stroke="#2a2f3a" stroke-width="1"/>`;
 for(const s of st){if(s.p[1]!==1)continue;const [px,,pz]=s.p;const [nx,ny,nz]=s.n;const col=colour(s,mask);
  const cx=T+(px+1)*C, cz=T+(pz+1)*C;
  if(ny===1)out+=r(cx,cz,C,C,col);
  else if(nz===1)out+=r(cx,T+3*C,C,T,col);
  else if(nz===-1)out+=r(cx,0,C,T,col);
  else if(nx===1)out+=r(T+3*C,cz,T,C,col);
  else if(nx===-1)out+=r(0,cz,T,C,col);}

function arrows(st,mask){
 const T=12,C=25,cen=p=>[T+(p[0]+1)*C+C/2,T+(p[2]+1)*C+C/2];
 const mainCorner=mask==="corners";
 const moves=new Map();
 for(const s of st){if(s.p[1]!==1||s.h[1]!==1||eq(s.p,s.h))continue;moves.set(s.p.join(),[s.p,s.h]);}
 const head=(x,y,ux,uy,w,l)=>`M${x} ${y}L${x-ux*l-uy*w} ${y-uy*l+ux*w}L${x-ux*l+uy*w} ${y-uy*l-ux*w}Z`;
 const done=new Set();let main="",sec="";
 for(const [k,[a,b]] of moves){if(done.has(k))continue;done.add(k);
  const back=moves.get(b.join());const swap=back&&eq(back[1],a);if(swap)done.add(b.join());
  const primary=isCorner(a)===mainCorner;
  const w=primary?4.4:3.2,l=primary?7.6:5.6,sw=primary?2.6:1.7,g=primary?5:2;
  const [x1,y1]=cen(a),[x2,y2]=cen(b);const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;
  let d,h;
  const mx=(x1+x2)/2-50,my=(y1+y2)/2-50,mL=Math.hypot(mx,my);
  if(false){ // bend inward, towards the centre
   const bx=-mx/mL*9,by=-my/mL*9,cx=(x1+x2)/2+bx,cy=(y1+y2)/2+by;
   const u1=[cx-x1,cy-y1],n1=Math.hypot(...u1),u2=[x2-cx,y2-cy],n2=Math.hypot(...u2);
   const a1=[u1[0]/n1,u1[1]/n1],a2=[u2[0]/n2,u2[1]/n2];
   const sx=x1+a1[0]*g,sy=y1+a1[1]*g,ex=x2-a2[0]*g,ey=y2-a2[1]*g;
   d=`M${sx} ${sy}Q${cx} ${cy} ${ex} ${ey}`;h=head(ex,ey,a2[0],a2[1],w,l);if(swap)h+=head(sx,sy,-a1[0],-a1[1],w,l);
  }else{
   const sx=x1+ux*g,sy=y1+uy*g,ex=x2-ux*g,ey=y2-uy*g;
   d=`M${sx} ${sy}L${ex} ${ey}`;h=head(ex,ey,ux,uy,w,l);if(swap)h+=head(sx,sy,-ux,-uy,w,l);}
  const path=`<path d="${d}" fill="none" stroke="#1d2330" stroke-width="${sw}" stroke-linecap="round"${primary?"":' stroke-dasharray="3 2.5"'}/><path d="${h}" fill="#1d2330"/>`;
  if(primary)main+=path;else sec+=path}
 return (sec?`<g opacity=".55">${sec}</g>`:"")+main}
function checkF2L(st){
 for(const s of st){if(s.p[1]===1&&s.p[0]===0&&s.p[2]===0&&s.f!=="U")return false;
  if(s.p[1]<1){const faceNow=Object.keys(NORM).find(k=>eq(NORM[k],s.n));if(faceNow!==s.f)return false;}}
 return true}
function isSolvedLL(st){return st.every(s=>{const k=Object.keys(NORM).find(k=>eq(NORM[k],s.n));return k===s.f})}

 for(let k=0;k<(pll?4:1);k++){const t=solved();apply(t,invert(moves.concat(fix,k?[["U",k]]:[])));

 let pen=null;
 if(tState==="insp"){const over=(performance.now()-inspEnd)/1000;pen=over>2?"dnf":over>0?"p2":null}
 cancelAnimationFrame(tRaf);tState="run";tStart=performance.now();clock().classList.add("run");
 clock().dataset.pen=pen||"";loop()}
function stopTimer(){cancelAnimationFrame(tRaf);const ms=performance.now()-tStart;tState="idle";
 clock().classList.remove("run");const pen=clock().dataset.pen;clock().dataset.pen="";
 times.push({ms,scr:curScr,plus2:pen==="p2",dnf:pen==="dnf",at:Date.now()});tSave();
 show(fmtT(ms));renderTimes();setScr()}
function tInit(){
 const side=document.getElementById("timer");
 const paintSide=()=>{side.classList.toggle("shut",tShut);
  const b=document.getElementById("tFold");b.innerHTML=tShut?"\u25b8":"\u25c2";b.title=tShut?"Show timer":"Hide timer"};
 document.getElementById("tFold").onclick=()=>{tShut=!tShut;tSave();paintSide()};paintSide();
 const ins=document.getElementById("tInsp");ins.checked=tInsp;
 ins.onchange=()=>{tInsp=ins.checked;tSave();document.getElementById("tHint").textContent=tInsp?"Hold space \u2014 release to start inspection":"Hold space (or touch) \u2014 release to start"};
 ins.onchange();
 document.getElementById("tNew").onclick=setScr;
 const cl=document.getElementById("tClear");let armed=0;
 cl.onclick=()=>{if(!times.length)return;
  if(!armed){armed=1;cl.textContent="Delete all times?";setTimeout(()=>{if(armed){armed=0;cl.textContent="Clear session"}},4000);return}
  armed=0;cl.textContent="Clear session";times=[];tSave();renderTimes()};
 const c=clock();
 c.addEventListener("touchstart",e=>{e.preventDefault();beginHold()},{passive:false});
 c.addEventListener("touchend",e=>{e.preventDefault();endHold()},{passive:false});
 c.addEventListener("mousedown",beginHold);c.addEventListener("mouseup",endHold);
 window.addEventListener("keydown",e=>{if(e.code!=="Space"||e.repeat)return;
  const t=e.target;if(t&&(t.tagName==="TEXTAREA"||t.tagName==="INPUT"||t.isContentEditable))return;
  e.preventDefault();beginHold()});
 window.addEventListener("keyup",e=>{if(e.code!=="Space")return;
  const t=e.target;if(t&&(t.tagName==="TEXTAREA"||t.tagName==="INPUT"||t.isContentEditable))return;
  e.preventDefault();endHold()});
 setScr();renderTimes()}
tInit();

/* ---- theme + print ---- */
const THKEY="twolook-theme";
function applyTheme(){const t=localStorage.getItem(THKEY)||"auto";
 const r=document.documentElement;if(t==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",t);
 const b=document.getElementById("theme");if(b)b.textContent="Theme: "+t}
document.getElementById("theme").onclick=()=>{const cur=localStorage.getItem(THKEY)||"auto";
 const next={auto:"light",light:"dark",dark:"auto"}[cur];
 try{localStorage.setItem(THKEY,next)}catch(e){}applyTheme()};
try{applyTheme()}catch(e){}
document.getElementById("print").onclick=()=>window.print();
/* ---- compact menus ---- */
(function(){const mb=document.getElementById("menuBtn"),tl=document.getElementById("tools");
 if(mb&&tl){mb.onclick=e=>{e.stopPropagation();const o=tl.classList.toggle("open");
   mb.setAttribute("aria-expanded",o?"true":"false");mb.textContent=o?"Menu \u25b4":"Menu \u25be"};
  document.addEventListener("click",e=>{if(tl.classList.contains("open")&&!tl.contains(e.target)&&e.target!==mb){
   tl.classList.remove("open");mb.setAttribute("aria-expanded","false");mb.textContent="Menu \u25be"}});
  tl.querySelectorAll("button,label").forEach(b=>b.addEventListener("click",()=>{
   if(b.id!=="theme"){tl.classList.remove("open");mb.textContent="Menu \u25be";mb.setAttribute("aria-expanded","false")}}));}
 const hb=document.getElementById("tHist"),lst=document.getElementById("tList"),cl=document.getElementById("tClear");
 if(hb&&lst)hb.onclick=()=>{const o=lst.classList.toggle("open");
  hb.textContent=(o?"Times \u25b4":"Times \u25be");if(cl)cl.style.display=o?"":""};
})();
