<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speedcubing Assistant</title>
<!-- data-pwa: dropped from the single-file build -->
<link rel="manifest" href="manifest.json" data-pwa>
<meta name="theme-color" content="#ffd21f" data-pwa>
<meta name="apple-mobile-web-app-capable" content="yes" data-pwa>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" data-pwa>
<meta name="apple-mobile-web-app-title" content="Cubing" data-pwa>
<link rel="icon" href="icons/icon-192.png" sizes="192x192" data-pwa>
<link rel="apple-touch-icon" href="icons/icon-192.png" data-pwa>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<!-- data-app-css / data-app: inlined by the single-file build and by "Download offline copy" -->
<link rel="stylesheet" href="css/app.css" data-app-css>
</head>
<body><div id="app"><div class="wrap">
<div class="top"><h1>Speedcubing Assistant</h1>
<div class="menuwrap"><button id="menuBtn" type="button" class="menubtn" aria-expanded="false">Menu &#9662;</button>
<div class="tools" id="tools"><button id="dlHtml" type="button">Download offline copy</button><button id="exJson" type="button">Export .json</button><label class="btnlike" for="imJson">Import .json</label><input id="imJson" type="file" accept=".json,application/json" hidden><button id="bake" type="button" hidden>Save edits into the page</button><button id="print" type="button">Print sheet</button><button id="theme" type="button">Theme: auto</button><button id="resetAll" type="button">Reset all</button><span id="sync" class="sync"></span></div></div></div>
<aside id="timer" class="side">
<button id="tFold" class="tfold" type="button" title="Shrink timer">&#9652;</button>
<div class="tbody">
<div class="thead"><h2>Timer</h2><button id="tNew" type="button" class="small">New scramble</button><label class="insp"><input type="checkbox" id="tInsp"> 15s inspection</label></div>
<div id="tScr" class="scramble"></div>
<div id="tClock" class="clock" tabindex="0" role="button" aria-label="Hold space or tap and hold, then release to start">0.00</div>
<div id="tStats" class="stats"></div>
<button id="tHist" type="button" class="small histbtn">Times &#9662;</button>
<ul id="tList" class="times"></ul>
<div class="tbot"><button id="tClear" type="button" class="small">Clear session</button></div>
</div></aside>
<div class="grid" id="grid">
<section class="col"><div class="colhead"><select class="setpick" aria-label="Left column"></select><span class="chev">&#9662;</span></div><div class="colbody"></div></section>
<section class="col"><div class="colhead"><select class="setpick" aria-label="Right column"></select><span class="chev">&#9662;</span></div><div class="colbody"></div></section>
</div>
<div id="stash" hidden></div>
</div></div>
<script src="js/cube.js" data-app></script>
<script src="js/store.js" data-app></script>
<script src="js/cases.js" data-app></script>
<script src="js/timer.js" data-app></script>
<script src="js/ui.js" data-app></script>
<script src="js/app.js" data-app></script>
</body>
</html>
